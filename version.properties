# Single source of the manager version code: epoch + git commit count.
# Read by build.gradle.kts, apd/build.rs and .github/workflows/build.yml.
# (Also valid shell syntax, so CI can source this file directly.)
managerVersionEpoch=10200

# NorPatch release version: "3.0.X".
# Bump X by 1 on every release (3.0.0 -> 3.0.1 -> 3.0.2 -> ...).
# versionCode is still derived from epoch + git commit count, so it keeps
# increasing automatically on every commit.
managerVersionPatch=13
